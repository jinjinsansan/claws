name = "openclaw-nft-sync"
main = "src/index.ts"
compatibility_date = "2026-04-01"

[triggers]
crons = ["0 16 * * *"]  # UTC 16:00 = JST 01:00 (daily after reward batch)

[vars]
CHAIN_ID = "137"

# Secrets (set via `wrangler secret put`):
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# POLYGON_RPC_URL
# NFT_CONTRACT_ADDRESS
# API_SECRET
